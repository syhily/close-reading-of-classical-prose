description: |
  《孙绍振古典散文解读全编》是福建师范大学孙绍振教授对六十余篇先秦至明清古典散文经典解读的汇编，上海教育出版社 2021 年出版。全书以「导读：古代散文的解读观念和方法」总领，收录《老子》三章、《曹刿论战》、《过秦论》、《出师表》、《桃花源记》、《岳阳楼记》、《赤壁赋》、《项脊轩志》等经典篇目的个案解读，突破传统句法、修辞分析的框架，将立意、论证的宏观把握与文本微观分析相结合，揭示文体规范与形式的内在关联。
